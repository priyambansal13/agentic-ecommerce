{{- if .Values.observability.enabled }}
# Grafana LGTM (OTel collector + Tempo + Loki + Prometheus + Grafana) in one pod — services export OTLP here.
apiVersion: v1
kind: Service
metadata: { name: lgtm, labels: { app: lgtm, {{ include "infra.labels" . }} } }
spec:
  selector: { app: lgtm }
  ports: [{ name: grafana, port: 3000 }, { name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: lgtm, labels: { app: lgtm, {{ include "infra.labels" . }} } }
spec:
  replicas: 1
  selector: { matchLabels: { app: lgtm } }
  template:
    metadata: { labels: { app: lgtm, {{ include "infra.labels" . }} } }
    spec:
      containers:
        - name: lgtm
          image: {{ .Values.observability.image }}
          ports: [{ containerPort: 3000 }, { containerPort: 4317 }, { containerPort: 4318 }]
          resources: {{- toYaml .Values.observability.resources | nindent 12 }}
{{- end }}
