# S3-compatible object storage (product images, return evidence, audit exports).
apiVersion: v1
kind: Service
metadata: { name: minio, labels: { app: minio, {{ include "infra.labels" . }} } }
spec:
  selector: { app: minio }
  ports: [{ name: s3, port: 9000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: minio, labels: { app: minio, {{ include "infra.labels" . }} } }
spec:
  serviceName: minio
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio, {{ include "infra.labels" . }} } }
    spec:
      securityContext: { fsGroup: 65532 }
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          command: [sh, -c]
          args: ["mkdir -p {{ range .Values.minio.buckets }}/data/{{ . }} {{ end }}&& exec minio server --address :9000 /data"]
          env:
            - { name: MINIO_ROOT_USER, value: minio }
            - name: MINIO_ROOT_PASSWORD
              {{- include "infra.secret" "MINIO_ROOT_PASSWORD" | nindent 14 }}
          ports: [{ containerPort: 9000 }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 }, periodSeconds: 10 }
          resources: {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources: { requests: { storage: {{ .Values.minio.storage }} } }
