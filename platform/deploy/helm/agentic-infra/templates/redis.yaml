apiVersion: v1
kind: Service
metadata: { name: redis, labels: { app: redis, {{ include "infra.labels" . }} } }
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, labels: { app: redis, {{ include "infra.labels" . }} } }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, {{ include "infra.labels" . }} } }
    spec:
      securityContext: { runAsUser: 999, runAsGroup: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --maxmemory-policy noeviction --appendonly yes"]
          env:
            - name: REDIS_PASSWORD
              {{- include "infra.secret" "REDIS_PASSWORD" | nindent 14 }}
          ports: [{ containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 5 }
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          {{- include "infra.podSecurity" . | nindent 10 }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
