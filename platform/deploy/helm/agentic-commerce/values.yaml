# agentic-commerce apps chart — installed by `ac k8s deploy <env>` into namespace ac-apps.
# The service/zone catalogue comes from values.services.yaml (GENERATED by `ac k8s values` from backend
# service metadata and frontend/zones.json); image tags from envs/<env>.tags.json; per-env overrides from
# envs/<env>.yaml. Secrets (svc-<name>, zone-<name>, ac-db-bootstrap) are created by `ac k8s secrets <env>`.
global:
  publicUrl: http://localhost:8088      # https://<domain> in prod
  host: ""                              # ingress host; empty = any (local k3s)
  imageRegistry: ac                     # local: images ac/<name>:local; prod: ghcr.io/<owner>/ac
  defaultTag: local
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []                  # e.g. [ghcr] for private ghcr images
  infraNamespace: ac-infra
  secretsVersion: ""                    # hash of the env file — changing it rolls pods to pick up new secrets
  tls: null                             # { secretName: ac-tls }
  ingressAnnotations: {}                # { cert-manager.io/cluster-issuer: letsencrypt }
  networkPolicies: true

serviceDefaults:
  replicas: 1
  resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { memory: 384Mi } }
zoneDefaults:
  replicas: 1
  resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { memory: 384Mi } }

# shared non-secret settings for every service (service-specific secrets come from Secret svc-<name>)
serviceEnv:
  NODE_ENV: production
  KAFKA_BROKERS: redpanda-0.redpanda.ac-infra.svc.cluster.local:9092
  OPA_URL: http://opa:8181
  OPENSEARCH_URL: http://opensearch.ac-infra.svc.cluster.local:9200
  S3_ENDPOINT: http://minio.ac-infra.svc.cluster.local:9000
  KONG_URL: http://edge:8000
  MODEL_FAST: gpt-4.1-mini
  MODEL_SMART: gpt-4.1
  MODEL_VISION: gpt-4.1
  MODEL_EMBED: text-embedding-3-small
  EMBED_DIMENSIONS: "512"

edge:
  image: kong:3.9.4
  config: ""                            # kong.yml — set by the CLI (`ac kong --k8s`)
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }

opa:
  image: openpolicyagent/opa:1.21.3
  bundle: ""                            # base64 of `opa build -b backend/policies` — set by the CLI
  resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 256Mi } }

dbBootstrap:
  image: pgvector/pgvector:0.8.7-pg18
  minioImage: cgr.dev/chainguard/minio     # has mc; creates per-service buckets/users (objectstore.sh)

services: {}                            # from values.services.yaml
zones: {}                               # from values.services.yaml
