{{- if .Values.global.networkPolicies }}
# The architecture's call graph, enforced by the cluster (default deny, then allow):
#   ingress controller → zone-shell, edge        zone-shell → other zones (rewrites)
#   zones → edge (BFF)    services → edge (service-to-service via Kong)    edge → services
#   agents → opa          (everything → ac-infra is governed by the infra chart's policy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, labels: { {{ include "ac.labels" . }} } }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: services-from-edge, labels: { {{ include "ac.labels" . }} } }
spec:
  podSelector: { matchLabels: { ac/tier: service } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { ac/tier: edge } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: edge-from-ingress-zones-services, labels: { {{ include "ac.labels" . }} } }
spec:
  podSelector: { matchLabels: { ac/tier: edge } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - podSelector: { matchLabels: { ac/tier: zone } }
        - podSelector: { matchLabels: { ac/tier: service } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: shell-from-ingress, labels: { {{ include "ac.labels" . }} } }
spec:
  podSelector: { matchLabels: { app: zone-shell } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: zones-from-shell, labels: { {{ include "ac.labels" . }} } }
spec:
  podSelector:
    matchExpressions:
      - { key: ac/tier, operator: In, values: [zone] }
      - { key: app, operator: NotIn, values: [zone-shell] }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: zone-shell } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opa-from-agents, labels: { {{ include "ac.labels" . }} } }
spec:
  podSelector: { matchLabels: { app: opa } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: agents } } }] }]
{{- end }}
