name: backend-ci

# Microservices CI: only services affected by the change are built, tested and containerised.
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: backend/.nvmrc, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - id: list
        name: affected services (turbo dependency graph)
        run: |
          json=$(pnpm exec turbo ls --affected --output=json 2>/dev/null || echo '{"packages":{"items":[]}}')
          services=$(echo "$json" | node -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const items = (j.packages?.items ?? []).filter(p => p.path?.startsWith("services/")).map(p => p.path.split("/")[1]);
            console.log(JSON.stringify(items));')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "affected: $services"
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  service:
    needs: affected
    if: needs.affected.outputs.services != '[]'
    runs-on: ubuntu-24.04-arm            # images are linux/arm64 (Oracle Cloud Ampere A1 VM)
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: backend/.nvmrc, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build lint test --filter "@ac/${{ matrix.service }}..."
      - name: image → ghcr (linux/arm64)
        run: |
          img=ghcr.io/${{ github.repository_owner }}/ac/${{ matrix.service }}:${{ github.sha }}
          docker build -f services/${{ matrix.service }}/Dockerfile -t "$img" .
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker push "$img"
          fi

  # One service = one independent release: only this Deployment rolls in the cluster.
  deploy:
    needs: [affected, service]
    if: github.ref == 'refs/heads/main' && needs.affected.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment: prod                    # GitHub environment with required reviewers (manual approval)
    strategy:
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: kubeconfig + secrets env
        working-directory: .
        run: |
          printf '%s' "${{ secrets.PROD_KUBECONFIG }}" > platform/deploy/envs/prod.kubeconfig
          printf '%s' "${{ secrets.PROD_ENV }}" > platform/deploy/envs/prod.env
      - name: ac k8s deploy prod ${{ matrix.service }}
        working-directory: .
        run: AC_BACKEND_DIR=$PWD/backend node platform/scripts/ac.mjs k8s deploy prod ${{ matrix.service }} --tag ${{ github.sha }}
      # the updated platform/deploy/envs/prod.tags.json should be committed back (PR) — the release manifest

  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: backend/.nvmrc, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build test --filter "./libs/*"

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.21.3 test /policies -v

  # Agent release gate (docs/03 §3.8): refund graph + real OPA policies vs evals/refund (312 cases + 48 red team).
  # Runs when agents, policies, evals or contracts change. Offline model unless the OPENAI_API_KEY secret is set.
  agent-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --name-only "$base" HEAD 2>/dev/null | grep -qE '^backend/(services/agents/|policies/|evals/|libs/contracts/|libs/nest-common/)'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version-file: backend/.nvmrc, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile && pnpm exec turbo run build --filter "@ac/agents..."
      - if: steps.changed.outputs.run == 'true'
        name: OPA with the repo policies
        run: docker run -d --name opa -p 8181:8181 -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.21.3 run --server --addr :8181 /policies && sleep 3
      - if: steps.changed.outputs.run == 'true'
        name: refund evals (gate — fails on accuracy < 90 % or any unauthorized MONEY call)
        working-directory: backend/services/agents
        run: node dist/evals/run.js --agent refund --no-db
        env:
          OPA_URL: http://localhost:8181
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_PROVIDER: auto
